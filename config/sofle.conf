# Enable nice!view display
CONFIG_ZMK_DISPLAY=y
# Use CUSTOM status screen for nice!view (not BUILT_IN which is deprecated for nice!view)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Use a dedicated work queue/thread for nice!view display updates to improve responsiveness
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# We need this to be a HID boot device
CONFIG_ZMK_USB_BOOT=y
CONFIG_USB_HID_BOOT_PROTOCOL=y

# Enable ZMK Studio
# CONFIG_ZMK_STUDIO=y

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_WS2812_STRIP=y

# Disable external power toggling by the underglow
# This prevents the display from turning off when toggling RGB
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Turn off RGB underglow when USB is disconnected to save power
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# External power management
CONFIG_ZMK_EXT_POWER=y

# Improved debouncing for better responsiveness
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# BLE improvements for connection stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Sleep settings - 15 min
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=30000
